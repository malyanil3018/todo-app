<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My tasks</h1>

    <!-- Add-task form -->
    <form id="task-form">
      <input id="task-input" type="text" placeholder="What needs doing?" autocomplete="off" required>
      <button type="submit">Add task</button>
    </form>

    <p id="counter"></p>

    <!-- Tasks are inserted here by script.js -->
    <ul id="task-list"></ul>

    <p id="empty-message">No tasks yet. Add your first one above.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
